# SalesOS WebSocket proxy for Apache2.
#
# Enable with:
#   sudo a2enconf salesos_ws
#   sudo systemctl reload apache2
#
# Or include inside your <VirtualHost> block:
#   Include /etc/apache2/conf-available/salesos_ws.conf
#
# Required modules (enable once):
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#
# deploy.sh patches SALESOS_WS_PORT with the actual port before installing.

ProxyPreserveHost On

ProxyPass        /salesos-ws  ws://127.0.0.1:SALESOS_WS_PORT/
ProxyPassReverse /salesos-ws  ws://127.0.0.1:SALESOS_WS_PORT/
