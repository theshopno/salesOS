# SalesOS WebSocket proxy snippet.
#
# Include inside your active server {} block:
#   include /etc/nginx/snippets/salesos_ws.conf;
#
# deploy.sh patches the port placeholder below with sed before copying.
# The placeholder SALESOS_WS_PORT is replaced by the actual ws_port value
# (default 8080 from salesos_ws_internal_port option in SalesOS Settings).
#
# Set salesos_ws_url in SalesOS Settings to: wss://your-domain.com/salesos-ws

location /salesos-ws {
    proxy_pass          http://127.0.0.1:SALESOS_WS_PORT;
    proxy_http_version  1.1;

    proxy_set_header    Upgrade    $http_upgrade;
    proxy_set_header    Connection "upgrade";

    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
}
